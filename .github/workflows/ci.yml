name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main solo recibe PRs desde dev
  origen:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - if: github.head_ref != 'dev'
        run: |
          echo "::error::main solo recibe PRs desde dev (esta viene de ${{ github.head_ref }})"
          exit 1

  # Verifica el formato de los commits
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # Verifica que pasen los tests del backend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/Chiga.slnx
      - run: dotnet test backend/Chiga.UnitTests --no-build
      - run: dotnet test backend/Chiga.IntegrationTests --no-build

  # Verifica que no haya errores en las migraciones de la BD
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait db
      - run: docker compose run --rm flyway migrate
      - run: docker compose run --rm flyway validate
      - run: docker compose run --rm seed
      - name: Logs de la BD
        if: failure()
        run: docker compose logs db

  # Verifica que pasen los tests del frontend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

# Activar cuando exista frontend/e2e (Playwright): levantar backend y
# frontend en el runner y correr `npm run test:e2e`.
  # e2e:
  #   needs: [backend, frontend]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
